<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cleveland 1989 — Art preview</title><link rel="stylesheet" href="scene-art.css"><script src="scene-art.js"></script>
<style>*{box-sizing:border-box}body{margin:0;background:#0a121b;color:#e9e8df;font:15px/1.6 system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:32px 20px}header{display:flex;gap:20px;justify-content:space-between;align-items:center;margin-bottom:24px}h1{font-size:clamp(25px,5vw,42px);margin:0;line-height:1.2}p{color:#a8bec7}a{color:#8fe3e7}.eyebrow{letter-spacing:.2em;color:#f0b281;font-size:11px}.play{border:1px solid #80d2d4;padding:10px 16px;text-decoration:none;white-space:nowrap}fieldset{border:1px solid #314758;padding:14px;display:flex;gap:18px;flex-wrap:wrap;margin:0 0 20px}label{display:flex;gap:9px;align-items:center;font-size:13px}select{max-width:100%;background:#182634;color:#f5f4ee;border:1px solid #4d667a;padding:9px}.scene-art{height:440px;max-height:none;min-height:200px;border:1px solid #314758;font-family:'Courier New',monospace}.scene-location{font-size:26px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}figure{margin:0;border:1px solid #283b4a;background:#111f2c}figure img{display:block;width:100%;aspect-ratio:16/9;object-fit:contain;background:radial-gradient(ellipse,#263c49,#0c1720)}figcaption{padding:10px 14px;text-transform:capitalize;font-size:13px;color:#b8cbd2}h2{font-size:20px;margin-top:32px}footer{padding-top:30px;color:#8ca8b8;font-size:12px}@media(max-width:600px){main{padding:20px 12px}header{align-items:flex-start;flex-direction:column}.scene-art{height:280px}.scene-location{font-size:18px}.grid{grid-template-columns:1fr 1fr;gap:8px}figcaption{font-size:11px;padding:8px}}</style></head>
<body><main><header><div><div class="eyebrow">ALIEN INVASION / FIRST ART RELEASE</div><h1>Cleveland, after dark.</h1><p>Ten streets. Four invaders. Two endings.</p></div><a class="play" href="index.html">Play the game →</a></header>
<fieldset><legend>Explore the artwork</legend><label>Street <select id="streetSelect"><option value="ontario">Ontario St — Public Square</option><option value="superior">Superior Ave</option><option value="euclid">Euclid Ave</option><option value="e9th">East 9th Street</option><option value="lakeside">Lakeside Ave</option><option value="w6th">West 6th</option><option value="oldriver">Old River Rd</option><option value="prospect">Prospect Ave</option><option value="huron">Huron Rd</option><option value="erieside">Erieside Ave</option></select></label><label>Enemy <select id="enemySelect"><option value="">None</option><option>blue</option><option>green</option><option>grey</option><option>red</option></select></label><label><input id="bossToggle" type="checkbox"> Boss treatment</label></fieldset>
<section id="sceneArt" class="scene-art" aria-label="Current scene">
        <img id="streetArt" class="street-art" alt="" decoding="async" hidden />
        <div class="scene-heading">
          <span id="sceneChapter"></span>
          <span id="sceneStatus" class="scene-status"></span>
        </div>
        <div id="enemyActor" class="enemy-actor" hidden>
          <img id="enemyArt" class="enemy-art" alt="" decoding="async" hidden />
        </div>
        <div id="sceneLocation" class="scene-location"></div>
      </section><h2>The complete first release</h2><div class="grid"><figure><a href="images/art/street-ontario.webp"><img src="images/art/street-ontario.webp" loading="lazy" alt="street ontario"></a><figcaption>street ontario</figcaption></figure>

<figure><a href="images/art/street-east-9th.webp"><img src="images/art/street-east-9th.webp" loading="lazy" alt="street east 9th"></a><figcaption>street east 9th</figcaption></figure>
<figure><a href="images/art/street-lakeside.webp"><img src="images/art/street-lakeside.webp" loading="lazy" alt="street lakeside"></a><figcaption>street lakeside</figcaption></figure>
<figure><a href="images/art/street-west-6th.webp"><img src="images/art/street-west-6th.webp" loading="lazy" alt="street west 6th"></a><figcaption>street west 6th</figcaption></figure>

<figure><a href="images/art/street-huron.webp"><img src="images/art/street-huron.webp" loading="lazy" alt="street huron"></a><figcaption>street huron</figcaption></figure>
<figure><a href="images/art/street-erieside.webp"><img src="images/art/street-erieside.webp" loading="lazy" alt="street erieside"></a><figcaption>street erieside</figcaption></figure>

<figure><a href="images/art/ending-defeat.webp"><img src="images/art/ending-defeat.webp" loading="lazy" alt="ending defeat"></a><figcaption>ending defeat</figcaption></figure></div><footer>Illustrated interpretation of the game's 1989 setting. Shop and conversation illustrations are planned for the next art release.</footer></main>
<script>const streets=[["ontario","Ontario St — Public Square"],["superior","Superior Ave"],["euclid","Euclid Ave"],["e9th","East 9th Street"],["lakeside","Lakeside Ave"],["w6th","West 6th"],["oldriver","Old River Rd"],["prospect","Prospect Ave"],["huron","Huron Rd"],["erieside","Erieside Ave"]];function refresh(){const id=document.getElementById('streetSelect').value;const color=document.getElementById('enemySelect').value;const index=streets.findIndex(x=>x[0]===id);SceneArt.render({street:{id,name:streets[index][1]},level:index+1,scene:color?'combat':'explore',enemy:color?{color,hp:30,isBoss:document.getElementById('bossToggle').checked}:null});}document.querySelectorAll('select,input').forEach(el=>el.addEventListener('change',refresh));refresh();</script></body></html>
